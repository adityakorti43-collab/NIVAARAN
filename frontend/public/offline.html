<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#142D27" />
  <title>Offline · Nivaaran</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 70% 30%, #21443a 0%, #142d27 45%, #0b1a16 100%); color: #f5f2ea;
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", "Nirmala UI", sans-serif; }
    main { max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 38px; margin: 20px 0 8px; }
    p { color: rgba(245, 242, 234, 0.72); line-height: 1.6; margin: 0 0 24px; }
    button { background: #b69a62; color: #142d27; border: 0; border-radius: 4px; padding: 12px 22px; font: 600 15px inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Nivaaran needs an internet connection to read your policy and bills. Your documents are safe on the server. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
